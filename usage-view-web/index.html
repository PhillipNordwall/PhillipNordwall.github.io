  <script>
    const snapEl = document.getElementById('snapshot-data');
    const SNAPSHOT = snapEl ? JSON.parse(snapEl.textContent) : null;
    let currentReport = null;
    let refreshSec = 60;
    let lastFetchMs = null;     // browser time of last successful fetch
    let nextFetchMs = null;
    let fetchError = null;

    // "Now" for countdowns: frozen at capture time in a snapshot.
    function nowMs() { return SNAPSHOT ? new Date(SNAPSHOT.report.generated_at).getTime() : Date.now(); }

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      const b = document.getElementById('theme-btn');
      if (b) b.textContent = t === 'light' ? '☀ Light' : '☾ Dark';
    }
    function toggleTheme() {
      const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      try { localStorage.setItem('usage-view-theme', t); } catch (e) {}
      applyTheme(t);
    }
    (function initTheme() {
      let t = null;
      try { t = localStorage.getItem('usage-view-theme'); } catch (e) {}
      if (t !== 'light') t = 'dark';
      applyTheme(t);
    })();

    function saveSnapshot() {
      if (!currentReport) return;
      const clone = document.documentElement.cloneNode(true);
      const data = document.createElement('script');
      data.id = 'snapshot-data';
      data.type = 'application/json';
      data.textContent = JSON.stringify({
        report: currentReport,
        captured_at: new Date().toISOString(),
        refresh_sec: refreshSec,
      }).replace(/</g, '\\u003c');
      clone.querySelector('body').insertBefore(data, clone.querySelector('body script'));
      const html = '<!DOCTYPE html>\n' + clone.outerHTML;
      const blob = new Blob([html], {type: 'text/html'});
      const a = document.createElement('a');
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      a.href = URL.createObjectURL(blob);
      a.download = `usage-view-snapshot-${stamp}.html`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }

    function fmtClock(ms) { return new Date(ms).toLocaleTimeString(); }

    function updateBanner() {
      const el = document.getElementById('status-banner');
      if (SNAPSHOT) {
        el.className = 'banner snapshot';
        el.textContent = `📸 Static snapshot — data collected ${new Date(SNAPSHOT.report.generated_at).toLocaleString()}, ` +
          `saved ${new Date(SNAPSHOT.captured_at).toLocaleString()}. Not live; countdowns are frozen at collection time.`;
        return;
      }
      if (!lastFetchMs) { el.className = 'banner'; el.textContent = fetchError ? `⚠ ${fetchError}` : 'Loading…'; return; }
      const left = Math.max(0, Math.round((nextFetchMs - Date.now()) / 1000));
      el.className = 'banner' + (fetchError ? ' stale' : '');
      el.textContent = `● Live — data sent by server at ${fmtClock(lastFetchMs)}; next automatic update in ${left}s ` +
        `(every ${refreshSec}s).` + (fetchError ? ` ⚠ Last update failed (${fetchError}); showing previous data.` : '');
    }
    const openSections = new Set();
    let initializedDefaults = false;

    function barColor(usedPct) {
      if (usedPct >= 85) return 'var(--red)';
      if (usedPct >= 60) return 'var(--yellow)';
      return 'var(--green)';
    }

    function fmtCountdown(isoReset) {
      if (!isoReset) return 'N/A';
      const target = new Date(isoReset).getTime();
      if (isNaN(target)) return 'N/A';
      const diffSec = Math.round((target - nowMs()) / 1000);
      if (diffSec <= 0) return 'passed (stale data)';
      const d = Math.floor(diffSec / 86400);
      const h = Math.floor((diffSec % 86400) / 3600);
      const m = Math.floor((diffSec % 3600) / 60);
      const s = diffSec % 60;
      if (d > 0) return `${d}d ${h}h ${m}m`;
      if (h > 0) return `${h}h ${m}m ${s}s`;
      return `${m}m ${s}s`;
    }

    // Share of a quota window's duration that has passed, mirroring
    // QuotaWindow.elapsed_percent() in models.py. Returns null outside the window.
    function elapsedInfo(windowSecs, isoReset) {
      if (!windowSecs || !isoReset) return null;
      const target = new Date(isoReset).getTime();
      if (isNaN(target)) return null;
      const leftSec = (target - nowMs()) / 1000;
      if (leftSec < 0 || leftSec > windowSecs) return null;
      const elapsed = Math.min(100, Math.max(0, (windowSecs - leftSec) / windowSecs * 100));
      return { elapsed, left: 100 - elapsed, leftSec };
    }

    // Same format as format_hms() in models.py, e.g. '3h 00m 0s' or '5d 02h 00m 0s'.
    function fmtHms(seconds) {
      const total = Math.max(0, Math.round(seconds));
      const d = Math.floor(total / 86400);
      const h = Math.floor((total % 86400) / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      const pad = n => String(n).padStart(2, '0');
      if (d > 0) return `${d}d ${pad(h)}h ${pad(m)}m ${s}s`;
      return `${h}h ${pad(m)}m ${s}s`;
    }

    function timeLabel(info) {
      return `${fmtHms(info.leftSec)} time window, ${info.elapsed.toFixed(1)}% used (${info.left.toFixed(1)}% left)`;
    }

    function timeBoxHtml(w) {
      if (!w.window_seconds) return '';
      const info = elapsedInfo(w.window_seconds, w.resets_at);
      return `
        <div class="time-box" data-window-secs="${w.window_seconds}" data-time-iso="${w.resets_at || ''}"
             style="${info ? '' : 'display:none'}">
          <div class="time-track"><div class="time-fill" style="width:${info ? info.elapsed : 0}%"></div></div>
          <div class="time-label">${info ? timeLabel(info) : ''}</div>
        </div>`;
    }

    function recordSectionState() {
      document.querySelectorAll('details.collapsible[data-sec-id]').forEach(el => {
        const id = el.getAttribute('data-sec-id');
        if (el.open) openSections.add(id);
        else openSections.delete(id);
      });
    }

    function toggleAllDetails(expand) {
      document.querySelectorAll('details.collapsible[data-sec-id]').forEach(el => {
        el.open = expand;
        const id = el.getAttribute('data-sec-id');
        if (expand) openSections.add(id);
        else openSections.delete(id);
      });
    }

    function isOpenAttr(secId, defaultOpen = false) {
      if (!initializedDefaults && defaultOpen) {
        openSections.add(secId);
      }
      return openSections.has(secId) ? 'open' : '';
    }

    function tickCountdowns() {
      document.querySelectorAll('[data-reset-iso]').forEach(el => {
        const iso = el.getAttribute('data-reset-iso');
        el.textContent = fmtCountdown(iso);
      });
      document.querySelectorAll('.time-box').forEach(el => {
        const info = elapsedInfo(Number(el.getAttribute('data-window-secs')), el.getAttribute('data-time-iso'));
        el.style.display = info ? '' : 'none';
        if (!info) return;
        el.querySelector('.time-fill').style.width = `${info.elapsed}%`;
        el.querySelector('.time-label').textContent = timeLabel(info);
      });
    }

    function render() {
      if (!currentReport) return;
      if (initializedDefaults) {
        recordSectionState();
      }
      document.getElementById('last-updated').textContent =
        `Data collected: ${new Date(currentReport.generated_at).toLocaleString()} • Zero-LLM API & Local Telemetry Mode`;

      const ob = currentReport.overall_best_bucket;
      const heroContainer = document.getElementById('overall-best-container');
      if (ob) {
        heroContainer.innerHTML = `
          <div class="hero-banner">
            <div class="hero-title">★ Overall Highest-Value Under-Utilized Bucket Across All Subscriptions</div>
            <div class="hero-main">${ob.provider_name} [${ob.plan_tier}] — ${ob.bucket_name}</div>
            <div class="hero-sub">
              <strong style="color:var(--c-green)">${ob.reason}</strong><br/>
              → ${ob.recommendation}
              ${ob.bonus_feature_note ? `<br/><span style="color:var(--c-purple)">★ ${ob.bonus_feature_note}</span>` : ''}
            </div>
          </div>
        `;
      } else {
        heroContainer.innerHTML = '';
      }

      const priorityContainer = document.getElementById('use-it-or-lose-it-container');
      const queue = currentReport.use_it_or_lose_it_queue || [];
      const conserve = currentReport.conserve_buckets || [];
      if (queue.length || conserve.length) {
        const urgencyTag = (u) => {
          if (u === 'immediate') return '<span class="tag tag-red">🔥 &lt;2h IMMINENT</span>';
          if (u === 'today') return '<span class="tag tag-yellow">⚡ &lt;24h TODAY</span>';
          return '<span class="tag">📅 THIS WEEK</span>';
        };
        const queueCards = queue.map((item, idx) => `
          <div class="priority-item urgency-${item.urgency_tier || 'today'}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">
              <span><strong style="color:var(--c-cyan)">#${idx + 1}</strong> <strong>[${item.provider_id.toUpperCase()}] ${item.bucket_name}</strong></span>
              <span>${urgencyTag(item.urgency_tier)} <span class="tag tag-green">${item.remaining_percent.toFixed(0)}% left</span></span>
            </div>
            <div class="bar-track" style="height:7px;margin-bottom:6px">
              <div class="bar-fill" style="width:${Math.min(100, item.used_percent)}%; background:${barColor(item.used_percent)}"></div>
            </div>
            <div class="item-sub" style="color:var(--text)">
              ⏳ Resets in <strong style="color:var(--c-amber)" data-reset-iso="${item.resets_at || ''}">${fmtCountdown(item.resets_at)}</strong> (${item.reset_local || 'N/A'}) • Score: <strong>${item.value_score}</strong>
            </div>
            <div class="item-sub">→ ${item.recommendation}</div>
            ${item.bonus_feature_note ? `<div class="item-sub" style="color:var(--c-purple)">★ ${item.bonus_feature_note}</div>` : ''}
          </div>
        `).join('');

        const conserveHtml = conserve.length ? `
          <div class="conserve-box">
            <div style="color:var(--c-red);font-weight:700;margin-bottom:4px">🛑 Buckets to Conserve / Avoid Burning Right Now</div>
            ${conserve.map(cb => `
              <div class="item-sub" style="color:var(--c-redsoft)">
                • <strong>[${cb.provider_id.toUpperCase()}] ${cb.bucket_name}</strong> — Only <strong>${cb.remaining_percent.toFixed(0)}% left</strong> (${cb.used_percent.toFixed(0)}% used, pace ${cb.pacing_ratio ? cb.pacing_ratio + 'x' : 'high'}), resets in <strong data-reset-iso="${cb.resets_at || ''}">${fmtCountdown(cb.resets_at)}</strong>.
              </div>
            `).join('')}
          </div>
        ` : '';

        priorityContainer.innerHTML = `
          <details class="collapsible" data-sec-id="global-use-it-or-lose-it" ${isOpenAttr('global-use-it-or-lose-it', true)}>
            <summary>⏳ Use-It-Or-Lose-It Prioritization Queue (${queue.length} expiring opportunities${conserve.length ? `, ${conserve.length} conserve alert` : ''})</summary>
            <div class="collapsible-body">
              <div class="priority-grid">${queueCards}</div>
              ${conserveHtml}
            </div>
          </details>
        `;
      } else {
        priorityContainer.innerHTML = '';
      }

      const grid = document.getElementById('providers-grid');
      grid.innerHTML = currentReport.providers.map(p => {
        const pid = p.provider_id;
        const statusClass = p.authenticated ? 'status-auth' : 'status-inst';
        const statusLabel = p.authenticated ? '● Authenticated' : (p.installed ? '◐ Installed' : '○ Not Detected');

        const bestHtml = p.best_bucket ? `
          <div class="best-box">
            <div style="color:var(--c-green);font-weight:700;margin-bottom:2px">★ Best Under-Utilized Bucket: ${p.best_bucket.bucket_name}</div>
            <div>${p.best_bucket.reason}</div>
            <div class="item-sub" style="color:var(--text)">→ ${p.best_bucket.recommendation}</div>
            ${p.best_bucket.bonus_feature_note ? `<div class="item-sub" style="color:var(--c-purple)">★ ${p.best_bucket.bonus_feature_note}</div>` : ''}
          </div>
        ` : '';

        const windowsHtml = p.windows.length ? p.windows.map(w => `
          <div class="window-box">
            <div class="window-top">
              <span>${w.name}</span>
              <span style="color:${barColor(w.used_percent)}">${w.used_percent.toFixed(1)}% used (${w.remaining_percent.toFixed(1)}% left)</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${Math.min(100, w.used_percent)}%; background:${barColor(w.used_percent)}"></div>
            </div>
            ${timeBoxHtml(w)}
            <div class="window-meta">
              <span>⏳ Resets in <strong style="color:var(--c-cyan)" data-reset-iso="${w.resets_at || ''}">${fmtCountdown(w.resets_at)}</strong> (${w.reset_local || 'N/A'})</span>
              ${w.pacing_ratio !== null && w.pacing_ratio !== undefined ? `<span>Pace: <strong>${w.pacing_ratio}x</strong></span>` : ''}
            </div>
            ${w.notes ? `<div class="item-sub">${w.notes}</div>` : ''}
          </div>
        `).join('') : `<div class="item-sub">No active quota window telemetry returned yet.</div>`;

        const pricingSecId = `${pid}-pricing`;
        const pricingHtml = (p.model_pricing && p.model_pricing.length) ? `
          <details class="collapsible" data-sec-id="${pricingSecId}" ${isOpenAttr(pricingSecId, false)}>
            <summary>External API Costs (vs. Monthly Plan) & Value/Perf (${p.model_pricing.length} tiers)</summary>
            <div class="collapsible-body">
              ${p.model_pricing.map(mp => `
                <div class="pricing-card">
                  <div class="pricing-top">
                    <span>${mp.display_name}</span>
                    <span>
                      <span class="tag tag-purple">${mp.perf_tier}</span>
                      <span class="tag tag-green">${mp.value_rating}</span>
                    </span>
                  </div>
                  <div class="pricing-rates">
                    <strong>API Cost:</strong> ${mp.formatted_api_rates} • <span class="tag tag-yellow">100-Turn Session: ${mp.session_100_turns_usd}</span>
                  </div>
                  <div class="item-sub" style="color:var(--text)"><strong>Plan Burn:</strong> ${mp.subscription_burn_rate}</div>
                  <div class="item-sub">${mp.capabilities}</div>
                </div>
              `).join('')}
            </div>
          </details>
        ` : '';

        const modelsSecId = `${pid}-models`;
        const modelsHtml = (p.model_quotas && p.model_quotas.length) ? `
          <details class="collapsible" data-sec-id="${modelsSecId}" ${isOpenAttr(modelsSecId, false)}>
            <summary>Per-Model / Family Quota Breakdown (${p.model_quotas.length})</summary>
            <div class="collapsible-body">
              <table class="model-table">
                <thead><tr><th>Model / Family</th><th>Window</th><th>Remaining</th><th>Resets In</th></tr></thead>
                <tbody>
                  ${p.model_quotas.map(m => `
                    <tr>
                      <td>${m.name}</td>
                      <td><span class="tag">${m.period_type}</span></td>
                      <td style="color:${barColor(m.used_percent)};font-weight:600">${m.remaining_percent.toFixed(1)}%</td>
                      <td data-reset-iso="${m.resets_at || ''}">${fmtCountdown(m.resets_at)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </details>
        ` : '';

        const creditsSecId = `${pid}-credits`;
        const creditsHtml = (p.credits && p.credits.length) ? `
          <details class="collapsible" data-sec-id="${creditsSecId}" ${isOpenAttr(creditsSecId, true)}>
            <summary>Credits, Overages & Monthly Caps (${p.credits.length})</summary>
            <div class="collapsible-body">
              ${p.credits.map(c => `
                <div class="list-item">
                  <div><strong>${c.name}</strong> <span class="tag ${c.enabled ? 'tag-green' : ''}">${c.enabled ? 'Enabled' : 'Disabled'}</span>
                  ${c.balance !== null && c.balance !== undefined ? ` • Balance: <strong>${c.balance} ${c.unit}</strong>` : ''}
                  ${c.limit !== null && c.limit !== undefined ? ` • Cap: <strong>${c.limit} ${c.unit}</strong>` : ''}
                  </div>
                  ${c.notes ? `<div class="item-sub">${c.notes}</div>` : ''}
                </div>
              `).join('')}
            </div>
          </details>
        ` : '';

        const featuresSecId = `${pid}-features`;
        const featuresHtml = (p.features && p.features.length) ? `
          <details class="collapsible" data-sec-id="${featuresSecId}" ${isOpenAttr(featuresSecId, true)}>
            <summary>Special Limits &amp; Deep Research (counts, windows)</summary>
            <div class="collapsible-body">
              ${p.features.map(f => {
                const srcTag = f.data_source === 'estimate' ? '<span class="tag tag-yellow">estimate (local logs)</span>'
                  : f.data_source === 'api' ? '<span class="tag tag-green">live API</span>'
                  : f.data_source === 'not_reported' ? '<span class="tag">not reported by API</span>' : '';
                const hasCount = f.limit_count !== null && f.limit_count !== undefined;
                const countHtml = hasCount ? `
                  <div style="margin-top:4px"><strong style="color:var(--c-green)">${f.remaining_count} left</strong>
                    of ${f.limit_count} <span style="color:var(--muted)">(${f.used_count || 0} used)</span>
                    ${f.period ? ` • window: <strong>${f.period}</strong>` : ''}</div>
                  <div class="bar-track" style="height:7px;margin:5px 0"><div class="bar-fill" style="width:${Math.min(100, hasCount && f.limit_count ? ((f.used_count || 0) / f.limit_count) * 100 : 0)}%; background:${barColor(f.limit_count ? ((f.used_count || 0) / f.limit_count) * 100 : 0)}"></div></div>` : '';
                const resetHtml = f.resets_at
                  ? `<div class="item-sub">⏳ Window resets in <strong data-reset-iso="${f.resets_at}">${fmtCountdown(f.resets_at)}</strong> (${f.reset_local || 'N/A'})</div>` : '';
                return `
                <div class="list-item">
                  <div><strong>${f.name}</strong> <span class="tag">${hasCount ? f.status : (f.period || f.status)}</span> ${srcTag}</div>
                  ${countHtml}
                  ${f.used_percent !== null && f.used_percent !== undefined && !hasCount ? `<div class="item-sub">${f.used_percent.toFixed(1)}% used</div>` : ''}
                  ${resetHtml}
                  ${f.window_note ? `<div class="item-sub">${f.window_note}</div>` : ''}
                  ${f.details ? `<div class="item-sub">${f.details}</div>` : ''}
                </div>`;
              }).join('')}
            </div>
          </details>
        ` : '';

        const discountsSecId = `${pid}-discounts`;
        const discountsHtml = (p.discounts && p.discounts.length) ? `
          <details class="collapsible" data-sec-id="${discountsSecId}" ${isOpenAttr(discountsSecId, false)}>
            <summary>Free / Discounted Periods & Multipliers (${p.discounts.length})</summary>
            <div class="collapsible-body">
              ${p.discounts.map(d => `
                <div class="list-item">
                  <div><strong>${d.name}</strong> <span class="tag ${d.active ? 'tag-green' : ''}">${d.active ? 'ACTIVE NOW' : d.schedule}</span> • ${d.multiplier}</div>
                  <div class="item-sub">${d.details}</div>
                </div>
              `).join('')}
            </div>
          </details>
        ` : '';

        const estApi = p.local_stats && p.local_stats.estimated_api_cost_usd
          ? `<span><strong>Local Transcript API Equiv:</strong> <strong style="color:var(--c-green)">~$${p.local_stats.estimated_api_cost_usd.toFixed(2)} USD</strong></span>`
          : '';

        return `
          <div class="card">
            <div class="card-header">
              <div>
                <div class="provider-title">${p.display_name}</div>
                <span class="tier-badge">Subscription: ${p.plan_tier}</span>
                ${p.subscription_details ? `<div class="item-sub" style="margin-top:6px">${p.subscription_details}</div>` : ''}
              </div>
              <span class="status-pill ${statusClass}">${statusLabel}</span>
            </div>
            <div class="meta-row">
              <span><strong>Source:</strong> ${p.source}</span>
              <span><strong>Cheapest Model:</strong> <code>${p.cheapest_model}</code></span>
              ${p.account_email ? `<span><strong>Account:</strong> ${p.account_email}</span>` : ''}
              ${estApi}
            </div>
            ${bestHtml}
            <div>
              <div class="section-title">Quota Windows & Reset Timers</div>
              ${windowsHtml}
            </div>
            ${pricingHtml}
            ${modelsHtml}
            ${creditsHtml}
            ${featuresHtml}
            ${discountsHtml}
          </div>
        `;
      }).join('');

      initializedDefaults = true;
      document.querySelectorAll('details.collapsible[data-sec-id]').forEach(el => {
        el.addEventListener('toggle', () => {
          const id = el.getAttribute('data-sec-id');
          if (el.open) openSections.add(id);
          else openSections.delete(id);
        });
      });
    }

    async function refreshData() {
      try {
        const res = await fetch('/api/usage');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const payload = await res.json();
        refreshSec = payload.refresh_interval_sec || refreshSec;
        currentReport = payload;
        lastFetchMs = Date.now();
        fetchError = null;
        render();
      } catch (e) {
        fetchError = String(e.message || e);
      }
      nextFetchMs = Date.now() + refreshSec * 1000;
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(refreshData, refreshSec * 1000);
      updateBanner();
    }

    let refreshTimer = null;
    if (SNAPSHOT) {
      currentReport = SNAPSHOT.report;
      ['refresh-btn', 'save-btn'].forEach(id => document.getElementById(id).style.display = 'none');
      render();
      updateBanner();
      tickCountdowns();
    } else {
      refreshData();
      setInterval(() => { tickCountdowns(); updateBanner(); }, 1000);
    }
  </script>
</body>
</html>
