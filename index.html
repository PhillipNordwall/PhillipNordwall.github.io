<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phillip Nordwall</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <style>
      body {
        margin: 0;
        background: #192b45;
      }

      #playfield {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }

      .ball {
        position: absolute;
        width: min(48px, 30vmin);
        aspect-ratio: 1;
        border-radius: 50%;
        background: #ffd166;
      }

      nav {
        position: relative;
        width: fit-content;
        background: #192b45;
        color: #fff;
      }

      nav a {
        color: inherit;
      }

      #physics-readout {
        position: fixed;
        top: 0;
        right: 0;
        margin: 0;
        padding: 0.75rem;
        background: #192b45;
        color: #fff;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main id="playfield" aria-label="Bouncing balls"></main>
    <nav aria-label="Projects">
      <ul>
        <li><a href="./deep_research/">deep|research</a></li>
        <li><a href="./usage-view-web/">usage-view-web</a></li>
      </ul>
    </nav>
    <pre id="physics-readout" aria-label="Physics values" hidden></pre>
    <script>
      const playfield = document.querySelector('#playfield');
      const readout = document.querySelector('#physics-readout');
      const initialBallCount = 24;
      const initialSpeed = 225;
      const attraction = 96000;
      const repulsion = 192000;
      const balls = [];
      let diameter;
      let maxX;
      let maxY;
      let forceScale = 1;
      let pointer = null;
      let previousTime;
      let paused = false;

      function measure() {
        if (balls.length === 0) return;
        diameter = balls[0].element.getBoundingClientRect().width;
        maxX = Math.max(0, playfield.clientWidth - diameter);
        maxY = Math.max(0, playfield.clientHeight - diameter);
      }

      function addBall() {
        const element = document.createElement('div');
        element.className = 'ball';
        const direction = Math.random() * 2 * Math.PI;
        const ball = {
          element,
          x: 0,
          y: 0,
          vx: initialSpeed * Math.cos(direction),
          vy: initialSpeed * Math.sin(direction),
        };
        balls.push(ball);
        playfield.append(element);
        if (balls.length === 1) measure();

        // Try a bounded number of positions so adding still works in a crowded field.
        for (let attempt = 0; attempt < 50; attempt++) {
          ball.x = Math.random() * maxX;
          ball.y = Math.random() * maxY;
          if (balls.every((other) => other === ball ||
              Math.hypot(ball.x - other.x, ball.y - other.y) >= diameter)) break;
        }
        render();
      }

      function removeBall() {
        if (balls.length === 0) return;
        const index = Math.floor(Math.random() * balls.length);
        const [ball] = balls.splice(index, 1);
        ball.element.remove();
      }

      function bounceOffWalls(ball) {
        if (ball.x < 0 || ball.x > maxX) {
          ball.vx = ball.x < 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
          ball.x = Math.max(0, Math.min(ball.x, maxX));
        }
        if (ball.y < 0 || ball.y > maxY) {
          ball.vy = ball.y < 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
          ball.y = Math.max(0, Math.min(ball.y, maxY));
        }
      }

      function advance(seconds) {
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            attract(balls[i], balls[j], seconds);
          }
        }

        for (const ball of balls) {
          if (pointer) {
            const dx = ball.x + diameter / 2 - pointer.x;
            const dy = ball.y + diameter / 2 - pointer.y;
            const distance = Math.hypot(dx, dy);
            if (distance > 0) {
              // Limit the acceleration within the ball's radius.
              const repulsionStep = forceScale * repulsion * seconds / Math.max(distance, diameter / 2) ** 2;
              ball.vx += repulsionStep * dx / distance;
              ball.vy += repulsionStep * dy / distance;
            }
          }
          ball.x += ball.vx * seconds;
          ball.y += ball.vy * seconds;
          bounceOffWalls(ball);
        }

        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            collide(balls[i], balls[j]);
          }
        }
      }

      function attract(first, second, seconds) {
        const dx = second.x - first.x;
        const dy = second.y - first.y;
        const distance = Math.hypot(dx, dy);
        if (distance > 0) {
          const attractionStep = forceScale * attraction * seconds / Math.max(distance, diameter) ** 2;
          const dvx = attractionStep * dx / distance;
          const dvy = attractionStep * dy / distance;
          first.vx += dvx;
          first.vy += dvy;
          second.vx -= dvx;
          second.vy -= dvy;
        }
      }

      function collide(first, second) {
        const dx = second.x - first.x;
        const dy = second.y - first.y;
        const distance = Math.hypot(dx, dy);
        if (distance >= diameter) return;

        const nx = distance > 0 ? dx / distance : 1;
        const ny = distance > 0 ? dy / distance : 0;
        const overlap = (diameter - distance) / 2;
        first.x -= overlap * nx;
        first.y -= overlap * ny;
        second.x += overlap * nx;
        second.y += overlap * ny;

        // Equal masses exchange their velocity components along the contact normal.
        const closingSpeed = (first.vx - second.vx) * nx + (first.vy - second.vy) * ny;
        if (closingSpeed > 0) {
          first.vx -= closingSpeed * nx;
          first.vy -= closingSpeed * ny;
          second.vx += closingSpeed * nx;
          second.vy += closingSpeed * ny;
        }
        bounceOffWalls(first);
        bounceOffWalls(second);
      }

      function render() {
        for (const ball of balls) {
          ball.element.style.transform = `translate(${ball.x}px, ${ball.y}px)`;
        }
      }

      function updateReadout() {
        let minSpeed = Infinity;
        let maxSpeed = 0;
        for (const ball of balls) {
          const speed = Math.hypot(ball.vx, ball.vy);
          minSpeed = Math.min(minSpeed, speed);
          maxSpeed = Math.max(maxSpeed, speed);
        }
        const speedRange = balls.length
          ? `${minSpeed.toFixed(1)}–${maxSpeed.toFixed(1)} px/s`
          : '—';
        const values = [
          `Balls       ${balls.length}`,
          `Force scale ${forceScale.toFixed(2)}×`,
          `Attraction  ${(forceScale * attraction).toFixed(0)}`,
          `Repulsion   ${(forceScale * repulsion).toFixed(0)}`,
          `Speed range ${speedRange}`,
          `Animation   ${paused ? 'Paused' : 'Running'}`,
        ].join('\n');
        if (readout.textContent !== values) readout.textContent = values;
      }

      function animate(now) {
        const elapsed = Math.min((now - (previousTime ?? now)) / 1000, 0.05);
        previousTime = now;
        if (!paused) {
          const steps = Math.ceil(elapsed * 240);
          for (let step = 0; step < steps; step++) {
            advance(elapsed / steps);
          }
          render();
        }
        if (!readout.hidden) updateReadout();
        requestAnimationFrame(animate);
      }

      for (let i = 0; i < initialBallCount; i++) addBall();

      window.addEventListener('resize', measure);
      window.addEventListener('wheel', (event) => {
        if (event.ctrlKey || event.deltaY === 0) return;
        forceScale = Math.max(0.01, Math.min(100, forceScale * 1.1 ** -Math.sign(event.deltaY)));
      }, { passive: true });
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Shift') {
          updateReadout();
          readout.hidden = false;
        }
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === ' ') {
          event.preventDefault();
          if (!event.repeat) {
            paused = !paused;
            previousTime = undefined;
          }
        }
        if (event.key === '>' || event.key === '<') {
          const speedFactor = event.key === '>' ? 1.1 : 1 / 1.1;
          for (const ball of balls) {
            ball.vx *= speedFactor;
            ball.vy *= speedFactor;
          }
        }
        if (event.key === '+') addBall();
        if (event.key === '-') removeBall();
        if (event.key === '0') {
          forceScale = 1;
        }
      });
      window.addEventListener('keyup', (event) => {
        if (event.key === 'Shift') readout.hidden = !event.shiftKey;
      });
      window.addEventListener('pointermove', (event) => {
        if (event.pointerType === 'mouse') {
          pointer = { x: event.clientX, y: event.clientY };
        }
      });
      document.documentElement.addEventListener('pointerleave', () => { pointer = null; });
      window.addEventListener('blur', () => {
        pointer = null;
        readout.hidden = true;
      });
      requestAnimationFrame(animate);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      }
    </script>
  </body>
</html>
