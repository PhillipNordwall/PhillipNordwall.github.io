<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phillip Nordwall</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <style>
      body {
        margin: 0;
        background: #192b45;
      }

      #playfield {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }

      #field-grid {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .ball {
        position: absolute;
        width: min(48px, 30vmin);
        aspect-ratio: 1;
        border-radius: 50%;
        background: #ffd166;
      }

      nav {
        position: relative;
        width: fit-content;
        background: #192b45;
        color: #fff;
      }

      nav a {
        color: inherit;
      }

      #physics-panel {
        position: fixed;
        top: 0.5rem;
        right: 0.5rem;
        box-sizing: border-box;
        width: min(17rem, 58vw);
        padding: 0.75rem;
        border: 1px solid #657893;
        border-radius: 0.5rem;
        background: #192b45f5;
        color: #fff;
        font: 0.8rem system-ui, sans-serif;
        pointer-events: none;
      }

      #physics-panel h2 {
        margin: 0 0 0.5rem;
        font-size: 0.95rem;
      }

      .energy-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.15rem 0.5rem;
        margin-bottom: 0.45rem;
        font-variant-numeric: tabular-nums;
      }

      .energy-track {
        grid-column: 1 / -1;
        position: relative;
        height: 0.45rem;
        background: #304762;
      }

      .energy-track::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        border-left: 1px solid #fff;
      }

      .energy-bar {
        position: absolute;
        height: 100%;
        background: var(--bar-color);
      }

      #mouse-repulsion, #physics-readout {
        margin: 0.65rem 0 0;
      }

      #physics-readout {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main id="playfield" aria-label="Bouncing balls with a distorted force-field grid">
      <canvas id="field-grid" aria-hidden="true"></canvas>
    </main>
    <nav aria-label="Projects">
      <ul>
        <li><a href="./deep_research/">deep_research</a></li>
        <li><a href="./usage-view-web/">usage-view-web</a></li>
      </ul>
    </nav>
    <section id="physics-panel" aria-labelledby="energy-title">
      <h2 id="energy-title">Energy</h2>
      <div id="kinetic-energy" class="energy-row">
        <span>Kinetic</span><span class="energy-value"></span>
        <div class="energy-track" aria-hidden="true"><div class="energy-bar" style="--bar-color: #ffd166"></div></div>
      </div>
      <div id="potential-energy" class="energy-row">
        <span>Potential</span><span class="energy-value"></span>
        <div class="energy-track" aria-hidden="true"><div class="energy-bar" style="--bar-color: #ff9eb5"></div></div>
      </div>
      <div id="total-energy" class="energy-row">
        <span>Total</span><span class="energy-value"></span>
        <div class="energy-track" aria-hidden="true"><div class="energy-bar" style="--bar-color: #8ddbd0"></div></div>
      </div>
      <p id="mouse-repulsion">Mouse repulsion off (Q)</p>
      <pre id="physics-readout" aria-label="Physics values" hidden></pre>
    </section>
    <script>
      const playfield = document.querySelector('#playfield');
      const canvas = document.querySelector('#field-grid');
      const brush = canvas.getContext('2d');
      let grid = [];
      let spacing;
      const readout = document.querySelector('#physics-readout');
      const mouseRepulsionStatus = document.querySelector('#mouse-repulsion');
      const energyRows = Array.from(document.querySelectorAll('.energy-row'), (row) => ({
        value: row.querySelector('.energy-value'),
        bar: row.querySelector('.energy-bar'),
      }));
      const energyFormat = new Intl.NumberFormat(undefined, {
        notation: 'compact',
        maximumSignificantDigits: 4,
      });
      const initialBallCount = 24;
      const initialSpeed = 225;
      const attraction = 96000;
      const repulsion = 192000;
      // Each ball has unit mass. Its (x, y) is the top-left corner in CSS pixels,
      // so forces measured from the cursor or grid use (x + radius, y + radius).
      const balls = [];
      let diameter;
      let maxX;
      let maxY;
      let forceScale = 1;
      let pointer = null;
      let mouseRepulsionEnabled = false;
      let previousTime;
      let paused = false;

      function measure() {
        if (balls.length === 0) return;
        diameter = balls[0].element.getBoundingClientRect().width;
        maxX = Math.max(0, playfield.clientWidth - diameter);
        maxY = Math.max(0, playfield.clientHeight - diameter);
      }

      function resizeGrid() {
        if (!brush) return;
        const width = playfield.clientWidth;
        const height = playfield.clientHeight;
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        brush.setTransform(scale, 0, 0, scale, 0, 0);
        brush.strokeStyle = 'rgba(135, 190, 218, 0.38)';
        spacing = Math.max(28, Math.ceil(Math.sqrt(width * height / 1800)));
        // Extend past the viewport so displaced lines still reach the edges.
        // Sample the field at fixed (x, y) each frame. Only (px, py) bends with it.
        grid = Array.from({ length: Math.ceil(height / spacing) + 3 }, (_, row) =>
          Array.from({ length: Math.ceil(width / spacing) + 3 }, (_, col) => ({
            x: (col - 1) * spacing, y: (row - 1) * spacing, px: 0, py: 0,
          })));
      }

      // Divide by distance once for direction and twice for inverse-square strength.
      // The cutoff caps the strength near a source. potentialFactor integrates this same law.
      function fieldFactor(dx, dy, strength, cutoff) {
        const squared = dx * dx + dy * dy;
        return squared === 0 ? 0 : strength / (Math.sqrt(squared) * Math.max(squared, cutoff * cutoff));
      }

      function drawField() {
        if (!brush) return;
        const radius = diameter / 2;
        const limit = spacing * 0.9;
        for (const row of grid) {
          for (const point of row) {
            let ax = 0;
            let ay = 0;
            for (const ball of balls) {
              const dx = ball.x + radius - point.x;
              const dy = ball.y + radius - point.y;
              const factor = fieldFactor(dx, dy, attraction, diameter);
              ax += dx * factor;
              ay += dy * factor;
            }
            if (mouseRepulsionEnabled && pointer) {
              const dx = point.x - pointer.x;
              const dy = point.y - pointer.y;
              const factor = fieldFactor(dx, dy, repulsion, radius);
              ax += dx * factor;
              ay += dy * factor;
            }
            // Compress large magnitudes while preserving the net force direction.
            const gain = limit / (18 / forceScale + Math.hypot(ax, ay));
            point.px = point.x + ax * gain;
            point.py = point.y + ay * gain;
          }
        }
        brush.clearRect(0, 0, playfield.clientWidth, playfield.clientHeight);
        brush.beginPath();
        for (const row of grid) {
          brush.moveTo(row[0].px, row[0].py);
          for (const point of row) brush.lineTo(point.px, point.py);
        }
        for (let col = 0; col < grid[0].length; col++) {
          brush.moveTo(grid[0][col].px, grid[0][col].py);
          for (const row of grid) brush.lineTo(row[col].px, row[col].py);
        }
        brush.stroke();
      }

      function addBall() {
        const element = document.createElement('div');
        element.className = 'ball';
        const direction = Math.random() * 2 * Math.PI;
        const ball = {
          element,
          x: 0,
          y: 0,
          vx: initialSpeed * Math.cos(direction),
          vy: initialSpeed * Math.sin(direction),
        };
        balls.push(ball);
        playfield.append(element);
        if (balls.length === 1) measure();

        // Try a bounded number of positions so adding still works in a crowded field.
        for (let attempt = 0; attempt < 50; attempt++) {
          ball.x = Math.random() * maxX;
          ball.y = Math.random() * maxY;
          if (balls.every((other) => other === ball ||
              Math.hypot(ball.x - other.x, ball.y - other.y) >= diameter)) break;
        }
        render();
      }

      function removeBall() {
        if (balls.length === 0) return;
        const index = Math.floor(Math.random() * balls.length);
        const [ball] = balls.splice(index, 1);
        ball.element.remove();
      }

      function bounceOffWalls(ball) {
        if (ball.x < 0 || ball.x > maxX) {
          ball.vx = ball.x < 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
          ball.x = Math.max(0, Math.min(ball.x, maxX));
        }
        if (ball.y < 0 || ball.y > maxY) {
          ball.vy = ball.y < 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
          ball.y = Math.max(0, Math.min(ball.y, maxY));
        }
      }

      function kick(seconds) {
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            attract(balls[i], balls[j], seconds);
          }
        }

        for (const ball of balls) {
          if (mouseRepulsionEnabled && pointer) {
            const dx = ball.x + diameter / 2 - pointer.x;
            const dy = ball.y + diameter / 2 - pointer.y;
            const factor = fieldFactor(dx, dy, repulsion, diameter / 2) * forceScale * seconds;
            ball.vx += dx * factor;
            ball.vy += dy * factor;
          }
        }
      }

      function advance(seconds) {
        // Velocity Verlet samples acceleration twice, at the starting positions
        // and again after movement and contact resolution, giving each half a step.
        kick(seconds / 2);
        for (const ball of balls) {
          ball.x += ball.vx * seconds;
          ball.y += ball.vy * seconds;
          bounceOffWalls(ball);
        }

        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            collide(balls[i], balls[j]);
          }
        }
        kick(seconds / 2);
      }

      function attract(first, second, seconds) {
        const dx = second.x - first.x;
        const dy = second.y - first.y;
        const factor = fieldFactor(dx, dy, attraction, diameter) * forceScale * seconds;
        first.vx += dx * factor;
        first.vy += dy * factor;
        second.vx -= dx * factor;
        second.vy -= dy * factor;
      }

      function collide(first, second) {
        const dx = second.x - first.x;
        const dy = second.y - first.y;
        const distance = Math.hypot(dx, dy);
        if (distance >= diameter) return;

        const nx = distance > 0 ? dx / distance : 1;
        const ny = distance > 0 ? dy / distance : 0;
        const overlap = (diameter - distance) / 2;
        first.x -= overlap * nx;
        first.y -= overlap * ny;
        second.x += overlap * nx;
        second.y += overlap * ny;

        // Equal masses exchange their velocity components along the contact normal.
        const closingSpeed = (first.vx - second.vx) * nx + (first.vy - second.vy) * ny;
        if (closingSpeed > 0) {
          first.vx -= closingSpeed * nx;
          first.vy -= closingSpeed * ny;
          second.vx += closingSpeed * nx;
          second.vy += closingSpeed * ny;
        }
        bounceOffWalls(first);
        bounceOffWalls(second);
      }

      function render() {
        for (const ball of balls) {
          ball.element.style.transform = `translate(${ball.x}px, ${ball.y}px)`;
        }
      }

      function potentialFactor(distance, cutoff) {
        // Integrate the capped inverse-square force with zero potential at infinity.
        return distance >= cutoff ? 1 / distance : (2 - distance / cutoff) / cutoff;
      }

      function measureEnergy() {
        let kinetic = 0;
        let potential = 0;
        const radius = diameter / 2;
        for (let i = 0; i < balls.length; i++) {
          const ball = balls[i];
          kinetic += (ball.vx ** 2 + ball.vy ** 2) / 2;
          if (mouseRepulsionEnabled && pointer) {
            const distance = Math.hypot(ball.x + radius - pointer.x, ball.y + radius - pointer.y);
            potential += repulsion * potentialFactor(distance, radius);
          }
          for (let j = i + 1; j < balls.length; j++) {
            const other = balls[j];
            const distance = Math.hypot(other.x - ball.x, other.y - ball.y);
            potential -= attraction * potentialFactor(distance, diameter);
          }
        }
        potential *= forceScale;
        return { kinetic, potential };
      }

      function updateEnergyChart({ kinetic, potential }) {
        const energies = [kinetic, potential, kinetic + potential];
        const maxMagnitude = Math.max(1, ...energies.map(Math.abs));
        energies.forEach((energy, index) => {
          const { value, bar } = energyRows[index];
          const label = energyFormat.format(energy);
          if (value.textContent !== label) value.textContent = label;
          const width = 50 * energy / maxMagnitude;
          bar.style.left = `${50 + Math.min(0, width)}%`;
          bar.style.width = `${Math.abs(width)}%`;
        });
      }

      function updateReadout() {
        let minSpeed = Infinity;
        let maxSpeed = 0;
        for (const ball of balls) {
          const speed = Math.hypot(ball.vx, ball.vy);
          minSpeed = Math.min(minSpeed, speed);
          maxSpeed = Math.max(maxSpeed, speed);
        }
        const speedRange = balls.length
          ? `${minSpeed.toFixed(1)}–${maxSpeed.toFixed(1)} px/s`
          : '—';
        const values = [
          `Balls       ${balls.length}`,
          `Force scale ${forceScale.toFixed(2)}×`,
          `Attraction  ${(forceScale * attraction).toFixed(0)}`,
          `Repulsion   ${mouseRepulsionEnabled ? (forceScale * repulsion).toFixed(0) : 'Off'}`,
          `Speed range ${speedRange}`,
          `Animation   ${paused ? 'Paused' : 'Running'}`,
        ].join('\n');
        if (readout.textContent !== values) readout.textContent = values;
      }

      function animate(now) {
        const elapsed = Math.min((now - (previousTime ?? now)) / 1000, 0.05);
        previousTime = now;
        // Inputs (including a moving cursor) have already changed the energy here.
        // Conserve this frame's starting energy while its external field is fixed.
        let energy = measureEnergy();
        if (!paused && elapsed > 0) {
          const target = energy.kinetic + energy.potential;
          const start = balls.map(({ x, y, vx, vy }) => ({ x, y, vx, vy }));
          const steps = Math.ceil(elapsed * 240);
          for (let step = 0; step < steps; step++) {
            advance(elapsed / steps);
          }
          energy = measureEnergy();
          const requiredKinetic = target - energy.potential;
          if (requiredKinetic >= 0 && energy.kinetic > 0) {
            // Kinetic energy scales with speed squared. One shared multiplier
            // corrects the energy drift while preserving relative speeds and directions.
            const factor = Math.sqrt(requiredKinetic / energy.kinetic);
            energy.kinetic = 0;
            for (const ball of balls) {
              ball.vx *= factor;
              ball.vy *= factor;
              energy.kinetic += (ball.vx ** 2 + ball.vy ** 2) / 2;
            }
          } else if (requiredKinetic !== energy.kinetic) {
            // A contact correction can place a nearly resting system above its
            // energy budget. Reflect the rejected move at its starting state.
            balls.forEach((ball, i) => {
              const { x, y, vx, vy } = start[i];
              Object.assign(ball, { x, y, vx: -vx, vy: -vy });
            });
            energy = measureEnergy();
          }
          render();
        }
        drawField();
        updateEnergyChart(energy);
        if (!readout.hidden) updateReadout();
        requestAnimationFrame(animate);
      }

      for (let i = 0; i < initialBallCount; i++) addBall();
      resizeGrid();

      window.addEventListener('resize', () => {
        measure();
        resizeGrid();
      });
      window.addEventListener('wheel', (event) => {
        if (event.ctrlKey || event.deltaY === 0) return;
        forceScale = Math.max(0.01, Math.min(100, forceScale * 1.1 ** -Math.sign(event.deltaY)));
      }, { passive: true });
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Shift') {
          updateReadout();
          readout.hidden = false;
        }
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key.toLowerCase() === 'q' && !event.repeat) {
          mouseRepulsionEnabled = !mouseRepulsionEnabled;
          mouseRepulsionStatus.textContent = `Mouse repulsion ${mouseRepulsionEnabled ? 'on' : 'off'} (Q)`;
        }
        if (event.key === ' ') {
          event.preventDefault();
          if (!event.repeat) {
            paused = !paused;
            previousTime = undefined;
          }
        }
        if (event.key === '>' || event.key === '<') {
          const speedFactor = event.key === '>' ? 1.1 : 1 / 1.1;
          for (const ball of balls) {
            ball.vx *= speedFactor;
            ball.vy *= speedFactor;
          }
        }
        if (event.key === '+') addBall();
        if (event.key === '-') removeBall();
        if (event.key === '0') {
          forceScale = 1;
        }
      });
      window.addEventListener('keyup', (event) => {
        if (event.key === 'Shift') readout.hidden = !event.shiftKey;
      });
      window.addEventListener('pointermove', (event) => {
        if (event.pointerType === 'mouse') {
          pointer = { x: event.clientX, y: event.clientY };
        }
      });
      document.documentElement.addEventListener('pointerleave', () => { pointer = null; });
      window.addEventListener('blur', () => {
        pointer = null;
        readout.hidden = true;
      });
      requestAnimationFrame(animate);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      }
    </script>
  </body>
</html>
