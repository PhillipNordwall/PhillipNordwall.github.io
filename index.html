<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phillip Nordwall</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <style>
      body {
        margin: 0;
        background: #192b45;
      }

      #playfield {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }

      #ball {
        width: min(48px, 30vmin);
        aspect-ratio: 1;
        border-radius: 50%;
        background: #ffd166;
      }

      nav {
        position: relative;
        width: fit-content;
        background: #192b45;
        color: #fff;
      }

      nav a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main id="playfield" aria-label="Bouncing ball animation">
      <div id="ball"></div>
    </main>
    <nav aria-label="Projects">
      <ul>
        <li><a href="./deep_research/">deep|research</a></li>
        <li><a href="./usage-view-web/">usage-view-web</a></li>
      </ul>
    </nav>
    <script>
      const playfield = document.querySelector('#playfield');
      const ball = document.querySelector('#ball');
      const startedAt = performance.now();
      let maxX;
      let maxY;

      function measure() {
        maxX = Math.max(0, playfield.clientWidth - ball.offsetWidth);
        maxY = Math.max(0, playfield.clientHeight - ball.offsetHeight);
      }

      function bounce(distance, limit) {
        if (limit === 0) return 0;
        const cycle = distance % (2 * limit);
        return Math.min(cycle, 2 * limit - cycle);
      }

      function animate(now) {
        const seconds = (now - startedAt) / 1000;
        const x = bounce(maxX / 2 + seconds * 180, maxX);
        const y = bounce(maxY / 2 + seconds * 135, maxY);
        ball.style.transform = `translate(${x}px, ${y}px)`;
        requestAnimationFrame(animate);
      }

      measure();
      window.addEventListener('resize', measure);
      requestAnimationFrame(animate);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      }
    </script>
  </body>
</html>
